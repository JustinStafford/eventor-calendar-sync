# Nightly: Eventor -> calendars on GitHub Pages. See README.md for the one-off setup.
#
# Secrets:   EVENTOR_API_KEY (required), ANTHROPIC_API_KEY (optional; without it, name patterns only)
# Variables: TOOL_REF  tag or commit of eventor-calendar-sync to run (default main). Pin it, so a
#                      change to the tool cannot alter your calendars until you choose to move.
#
# The job commits to two branches of this repository: `classifications.json` on the default
# branch (the classifier's memory) and the generated site on `gh-pages` (what Pages serves).

name: Publish calendars

on:
  schedule:
    # GitHub cron is UTC only. 17:07 UTC is 03:07 AEST (04:07 during AEDT).
    - cron: "7 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and report, publish nothing"
        type: boolean
        default: false
      force:
        description: "Publish even if the safety guard objects"
        type: boolean
        default: false
      no_llm:
        description: "Classify with name patterns only (no Claude API calls)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-calendars
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TOOL_REPO: https://github.com/JustinStafford/eventor-calendar-sync
      TOOL_REF: ${{ vars.TOOL_REF || 'main' }}
    steps:
      - uses: actions/checkout@v6

      - name: Check out the published site into public/
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch --depth=1 origin gh-pages
            git worktree add -B gh-pages public FETCH_HEAD
          else
            # First run: start an empty gh-pages branch.
            git worktree add --detach public
            git -C public checkout --orphan gh-pages
            git -C public rm -rf --quiet .
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build
        env:
          EVENTOR_API_KEY: ${{ secrets.EVENTOR_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run == true }}
          FORCE: ${{ inputs.force == true }}
          NO_LLM: ${{ inputs.no_llm == true }}
        run: |
          set -euo pipefail
          args=(--config config.toml --out public --cache classifications.json --report report.json)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ "$NO_LLM" = "true" ]; then args+=(--no-llm); fi
          uvx --from "git+${TOOL_REPO}@${TOOL_REF}" eventor-calendar-sync build "${args[@]}"

      - name: Commit new classifications
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f classifications.json ] && [ -n "$(git status --porcelain -- classifications.json)" ]; then
            git add classifications.json
            git commit --quiet -m "Update classifications"
            git push --quiet origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          cd public
          git add --all
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit --quiet -m "Publish calendars $(date -u +%F)"
            git push --quiet origin gh-pages
          fi

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: report-${{ github.run_number }}
          path: report.json
          if-no-files-found: ignore
          retention-days: 14
