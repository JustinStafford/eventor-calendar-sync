[project]
name = "eventor-calendar-sync"
version = "0.1.0"
description = "Publish subscribable iCalendar feeds of orienteering event series from Eventor."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Justin Stafford" }]
dependencies = [
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "segno>=1.6",
  "typer>=0.12",
]

[project.scripts]
eventor-calendar-sync = "eventor_calendar_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventor_calendar_sync"]

[dependency-groups]
dev = [
  "icalendar>=6",
  "pytest>=8",
  "ruff>=0.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "RET", "PIE", "ISC"]
ignore = ["RUF012"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q -p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:eventor_calendar_sync"]
